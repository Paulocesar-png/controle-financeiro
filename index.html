<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle Financeiro</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0a0e27">
    <meta name="description" content="Gerencie seus gastos e proventos">
    <link rel="manifest" href="manifest.json">
    
    <!-- Ícones para diferentes dispositivos -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        :root {
            --bg-main: #0a0e27;
            --bg-card: #1a1f3a;
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: #2d3348;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
        }
        
        .header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 24px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        
        .header p {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
        }
        
        .balance-card {
            margin: 20px;
            padding: 28px;
            background: linear-gradient(135deg, var(--bg-card) 0%, #242947 100%);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .balance-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-red));
        }
        
        .balance-label {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .balance-amount {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 16px;
        }
        
        .balance-amount.positive {
            color: var(--accent-green);
        }
        
        .balance-amount.negative {
            color: var(--accent-red);
        }
        
        .balance-summary {
            display: flex;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }
        
        .summary-item {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .summary-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        
        .summary-value {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .summary-item.income .summary-value {
            color: var(--accent-green);
        }
        
        .summary-item.expense .summary-value {
            color: var(--accent-red);
        }
        
        .add-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 20px;
            margin-bottom: 24px;
        }
        
        .btn {
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: -0.2px;
        }
        
        .btn-income {
            background: linear-gradient(135deg, #00ff88 0%, #00cc70 100%);
            color: #0a0e27;
            box-shadow: 0 4px 16px rgba(0, 255, 136, 0.25);
        }
        
        .btn-income:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(0, 255, 136, 0.25);
        }
        
        .btn-expense {
            background: linear-gradient(135deg, #ff3366 0%, #cc0044 100%);
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(255, 51, 102, 0.25);
        }
        
        .btn-expense:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(255, 51, 102, 0.25);
        }
        
        .transactions {
            padding: 0 20px;
        }
        
        .transactions-header {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }
        
        .transaction-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            /* touch-action: none; REMOVIDO - Permitir scroll */
        }
        
        .transaction-item-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .transaction-item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 48px;
        }
        
        .transaction-item.paid {
            opacity: 0.6;
            background: rgba(26, 31, 58, 0.5);
        }
        
        .transaction-item.paid .transaction-description {
            text-decoration: line-through;
            color: var(--text-secondary);
        }
        
        .transaction-item.paid .transaction-amount {
            opacity: 0.6;
        }
        
        .transaction-item.dragging {
            opacity: 0.5;
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            z-index: 1000;
        }
        
        .transaction-item.drag-over {
            border-color: var(--accent-green);
            transform: translateY(-4px);
        }
        
        .drag-handle {
            cursor: move;
            color: var(--text-secondary);
            font-size: 20px;
            padding: 8px;
            touch-action: none;
            user-select: none;
            flex-shrink: 0;
        }
        
        .drag-handle:active {
            color: var(--accent-green);
        }
        
        .transaction-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
        }
        
        .transaction-item.income::before {
            background: var(--accent-green);
        }
        
        .transaction-item.expense::before {
            background: var(--accent-red);
        }
        
        .transaction-info {
            flex: 1;
            min-width: 0;
        }
        
        .transaction-description {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        
        .transaction-date {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .transaction-amount {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.8px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .transaction-item.income .transaction-amount {
            color: var(--accent-green);
        }
        
        .transaction-item.expense .transaction-amount {
            color: var(--accent-red);
        }
        
        .transaction-buttons {
            display: flex;
            gap: 8px;
            margin-left: 12px;
        }
        
        .edit-btn {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: var(--accent-green);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .edit-btn:active {
            background: rgba(0, 255, 136, 0.2);
            transform: scale(0.95);
        }
        
        .delete-btn {
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid rgba(255, 51, 102, 0.3);
            color: var(--accent-red);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .delete-btn:active {
            background: rgba(255, 51, 102, 0.2);
            transform: scale(0.95);
        }
        
        .pay-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            transition: all 0.2s;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .pay-checkbox:active {
            transform: scale(0.9);
        }
        
        .pay-checkbox.checked {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            animation: fadeIn 0.2s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal.active {
            display: flex;
            align-items: flex-end;
        }
        
        .modal-content {
            background: var(--bg-card);
            border-radius: 24px 24px 0 0;
            padding: 28px 24px 32px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
            border: 1px solid var(--border-color);
            border-bottom: none;
        }
        
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .modal-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        
        .close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .close-btn:active {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(0.95);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: var(--accent-green);
            background: rgba(255, 255, 255, 0.05);
        }
        
        .btn-submit {
            width: 100%;
            padding: 18px;
            margin-top: 8px;
        }
        
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-secondary);
        }
        
        .empty-state-icon {
            font-size: 56px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .empty-state-text {
            font-size: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💰 Controle Financeiro</h1>
        <p>Gerencie seus gastos e proventos</p>
        <div style="margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 12px;">
            <button onclick="changeMonth(-1)" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; width: 36px; height: 36px; border-radius: 10px; font-size: 16px; cursor: pointer;">‹</button>
            <div onclick="goToCurrentMonth()" id="currentMonth" style="font-size: 16px; font-weight: 700; min-width: 150px; text-align: center; cursor: pointer;"></div>
            <button onclick="changeMonth(1)" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; width: 36px; height: 36px; border-radius: 10px; font-size: 16px; cursor: pointer;">›</button>
        </div>
        <div style="margin-top: 8px; font-size: 11px; color: var(--text-secondary); text-align: center;">Clique no mês para voltar ao atual</div>
    </div>
    
    <div class="balance-card">
        <div class="balance-label">Saldo Atual</div>
        <div class="balance-amount" id="balance">R$ 0,00</div>
        <div id="monthStatus" style="text-align: center; margin-top: 8px; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 8px; display: inline-block;"></div>
        <div class="balance-summary">
            <div class="summary-item income">
                <div class="summary-label">Proventos</div>
                <div class="summary-value" id="totalIncome">R$ 0,00</div>
            </div>
            <div class="summary-item expense">
                <div class="summary-label">Gastos</div>
                <div class="summary-value" id="totalExpense">R$ 0,00</div>
            </div>
        </div>
    </div>
    
    <div class="add-buttons">
        <button class="btn btn-income" onclick="openModal('income')">
            ➕ Provento
        </button>
        <button class="btn btn-expense" onclick="openModal('expense')">
            ➖ Gasto
        </button>
    </div>
    
    <div style="padding: 0 20px; margin-bottom: 20px;" id="replicateButtonContainer">
        <button id="replicateBtn" onclick="replicatePreviousMonth()" style="width: 100%; padding: 14px; background: rgba(100,150,255,0.1); border: 1px solid rgba(100,150,255,0.3); color: #6496ff; border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s;" onmouseover="this.style.background='rgba(100,150,255,0.2)'" onmouseout="this.style.background='rgba(100,150,255,0.1)'">
            <span id="replicateBtnText">📋 Replicar Mês Anterior</span>
        </button>
    </div>
    
    <div class="transactions">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <div class="transactions-header">Transações</div>
            <div style="display: flex; gap: 8px;">
                <button onclick="exportData()" style="background: rgba(0,255,136,0.1); border: 1px solid rgba(0,255,136,0.3); color: var(--accent-green); padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer;">💾</button>
                <button onclick="document.getElementById('importFile').click()" style="background: rgba(100,150,255,0.1); border: 1px solid rgba(100,150,255,0.3); color: #6496ff; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer;">📥</button>
            </div>
        </div>
        <div style="font-size: 11px; color: var(--text-secondary); margin-bottom: 12px; text-align: center; line-height: 1.5;">
            Segure ≡ para reordenar • Clique em ☐ para marcar gasto como pago
        </div>
        <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(this.files[0])">
        <div id="transactionsList"></div>
    </div>
    
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle"></h2>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <form id="transactionForm" onsubmit="addTransaction(event)">
                <div class="form-group">
                    <label for="description">Descrição</label>
                    <input type="text" id="description" required placeholder="Ex: Salário, Conta de luz...">
                </div>
                <div class="form-group">
                    <label for="amount">Valor (R$)</label>
                    <input type="text" inputmode="decimal" id="amount" required placeholder="0,00" oninput="formatCurrencyInput(this)">
                </div>
                <div class="form-group">
                    <label for="date">Data</label>
                    <input type="date" id="date" required>
                </div>
                <button type="submit" class="btn btn-submit" id="submitBtn"></button>
            </form>
        </div>
    </div>

    <script>
        let transactions = [];
        let currentType = '';
        let editingId = null;
        
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        
        const monthNames = [
            'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
            'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
        ];
        
        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            updateDisplay();
        }
        
        function goToCurrentMonth() {
            const today = new Date();
            currentMonth = today.getMonth();
            currentYear = today.getFullYear();
            updateDisplay();
        }
        
        // Função para formatar input de valor - aceita vírgula e ponto (iOS/Android)
        function formatCurrencyInput(input) {
            let value = input.value;
            
            // Remove tudo exceto números, vírgula e ponto
            value = value.replace(/[^\d,\.]/g, '');
            
            // Substitui vírgula por ponto para padronizar
            value = value.replace(',', '.');
            
            // Remove pontos extras (manter apenas o primeiro)
            const parts = value.split('.');
            if (parts.length > 2) {
                value = parts[0] + '.' + parts.slice(1).join('');
            }
            
            // Limitar a 2 casas decimais
            if (parts.length === 2 && parts[1].length > 2) {
                value = parts[0] + '.' + parts[1].substring(0, 2);
            }
            
            input.value = value;
        }
        
        // Função para converter valor do input para número
        function parseInputAmount(value) {
            // Substitui vírgula por ponto e converte para float
            return parseFloat(value.replace(',', '.')) || 0;
        }
        
        function getMonthKey(month, year) {
            return `${year}-${String(month + 1).padStart(2, '0')}`;
        }
        
        function getCurrentMonthTransactions() {
            const monthKey = getMonthKey(currentMonth, currentYear);
            const filtered = transactions.filter(t => {
                // Extrair ano e mês diretamente da string de data (formato YYYY-MM-DD)
                const dateParts = t.date.split('-');
                const tYear = parseInt(dateParts[0]);
                const tMonth = parseInt(dateParts[1]) - 1; // Mês começa em 0
                const tMonthKey = getMonthKey(tMonth, tYear);
                return tMonthKey === monthKey;
            });
            
            // Ordenar pela ordem customizada se existir, senão por data
            filtered.sort((a, b) => {
                const aOrder = a.customOrder && a.customOrder[monthKey] !== undefined ? a.customOrder[monthKey] : 999999;
                const bOrder = b.customOrder && b.customOrder[monthKey] !== undefined ? b.customOrder[monthKey] : 999999;
                
                if (aOrder !== bOrder) {
                    return aOrder - bOrder;
                }
                
                // Se não tem ordem customizada, ordenar por data (mais recente primeiro)
                return new Date(b.date) - new Date(a.date);
            });
            
            return filtered;
        }
        
        let db;
        
        // Inicializar IndexedDB - banco de dados local robusto
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('ControleFinanceiroDB', 1);
                
                request.onerror = () => {
                    console.error('❌ Erro ao abrir banco:', request.error);
                    reject(request.error);
                };
                
                request.onsuccess = () => {
                    db = request.result;
                    console.log('✅ Banco de dados conectado');
                    resolve(db);
                };
                
                request.onupgradeneeded = (event) => {
                    db = event.target.result;
                    if (!db.objectStoreNames.contains('transactions')) {
                        const store = db.createObjectStore('transactions', { keyPath: 'id' });
                        console.log('✅ Tabela de transações criada');
                    }
                };
            });
        }
        
        async function loadTransactions() {
            try {
                if (!db) await initDB();
                
                const transaction = db.transaction(['transactions'], 'readonly');
                const store = transaction.objectStore('transactions');
                const request = store.getAll();
                
                request.onsuccess = () => {
                    transactions = request.result || [];
                    transactions.sort((a, b) => b.id - a.id);
                    console.log('✅ Carregadas', transactions.length, 'transações do banco');
                    updateDisplay();
                };
                
                request.onerror = () => {
                    console.error('❌ Erro ao carregar transações');
                    updateDisplay();
                };
            } catch (error) {
                console.error('❌ Erro ao inicializar:', error);
                updateDisplay();
            }
        }
        
        async function saveTransactions() {
            try {
                if (!db) await initDB();
                
                const transaction = db.transaction(['transactions'], 'readwrite');
                const store = transaction.objectStore('transactions');
                
                // Limpar banco e salvar tudo novamente
                const clearRequest = store.clear();
                
                clearRequest.onsuccess = () => {
                    transactions.forEach(t => {
                        store.add(t);
                    });
                    console.log('✅ Salvas', transactions.length, 'transações no banco');
                };
                
                transaction.onerror = () => {
                    console.error('❌ Erro ao salvar transações');
                };
            } catch (error) {
                console.error('❌ Erro ao salvar:', error);
            }
        }
        
        function openModal(type, transactionId = null) {
            currentType = type;
            editingId = transactionId;
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modalTitle');
            const submitBtn = document.getElementById('submitBtn');
            const dateInput = document.getElementById('date');
            const form = document.getElementById('transactionForm');
            
            form.reset();
            
            if (transactionId) {
                // Modo de edição/ajuste
                const transaction = transactions.find(t => t.id === transactionId);

        let draggedElement = null;
        let draggedIndex = null;
        
        function setupDragAndDrop() {
            const items = document.querySelectorAll('.transaction-item');
            
            items.forEach((item, index) => {
                // Desktop - Drag Events
                item.addEventListener('dragstart', handleDragStart);
                item.addEventListener('dragend', handleDragEnd);
                item.addEventListener('dragover', handleDragOver);
                item.addEventListener('drop', handleDrop);
                item.addEventListener('dragleave', handleDragLeave);
                
                // Mobile - Touch Events
                item.addEventListener('touchstart', handleTouchStart, { passive: false });
                item.addEventListener('touchmove', handleTouchMove, { passive: false });
                item.addEventListener('touchend', handleTouchEnd);
            });
        }
        
        function handleDragStart(e) {
            draggedElement = this;
            draggedIndex = parseInt(this.dataset.index);
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }
        
        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.transaction-item').forEach(item => {
                item.classList.remove('drag-over');
            });
        }
        
        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            
            if (this !== draggedElement) {
                this.classList.add('drag-over');
            }
            return false;
        }
        
        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }
        
        function handleDrop(e) {
            e.stopPropagation();
            e.preventDefault();
            
            if (this !== draggedElement) {
                const targetIndex = parseInt(this.dataset.index);
                reorderTransactions(draggedIndex, targetIndex);
            }
            
            return false;
        }
        
        // Touch events para mobile
        let touchStartY = 0;
        let touchElement = null;
        let placeholder = null;
        let autoScrollInterval = null;
        const SCROLL_SPEED = 10;
        const SCROLL_ZONE = 100; // Pixels da borda para ativar auto-scroll
        
        function handleTouchStart(e) {
            const handle = e.target.closest('.drag-handle');
            if (!handle) return;
            
            e.preventDefault();
            touchElement = this;
            draggedIndex = parseInt(this.dataset.index);
            touchStartY = e.touches[0].clientY;
            
            this.classList.add('dragging');
            
            // Criar placeholder
            placeholder = this.cloneNode(true);
            placeholder.style.opacity = '0.3';
            placeholder.style.pointerEvents = 'none';
        }
        
        function handleTouchMove(e) {
            if (!touchElement) return;
            e.preventDefault();
            
            const touch = e.touches[0];
            const deltaY = touch.clientY - touchStartY;
            const touchY = touch.clientY;
            
            // Mover visualmente o elemento
            touchElement.style.transform = `translateY(${deltaY}px)`;
            
            // Auto-scroll quando próximo das bordas
            const windowHeight = window.innerHeight;
            
            if (touchY < SCROLL_ZONE) {
                // Perto do topo - scroll para cima
                startAutoScroll(-SCROLL_SPEED);
            } else if (touchY > windowHeight - SCROLL_ZONE) {
                // Perto do fundo - scroll para baixo
                startAutoScroll(SCROLL_SPEED);
            } else {
                stopAutoScroll();
            }
            
            // Detectar sobre qual item está
            const items = Array.from(document.querySelectorAll('.transaction-item'));
            
            items.forEach(item => {
                if (item === touchElement) return;
                const rect = item.getBoundingClientRect();
                const itemMiddle = rect.top + rect.height / 2;
                
                if (touchY > rect.top && touchY < rect.bottom) {
                    item.classList.add('drag-over');
                } else {
                    item.classList.remove('drag-over');
                }
            });
        }
        
        function startAutoScroll(speed) {
            if (autoScrollInterval) return; // Já está rolando
            
            autoScrollInterval = setInterval(() => {
                window.scrollBy(0, speed);
            }, 16); // ~60fps
        }
        
        function stopAutoScroll() {
            if (autoScrollInterval) {
                clearInterval(autoScrollInterval);
                autoScrollInterval = null;
            }
        }
        
        function handleTouchEnd(e) {
            if (!touchElement) return;
            
            stopAutoScroll(); // Parar auto-scroll
            
            touchElement.style.transform = '';
            touchElement.classList.remove('dragging');
            
            // Encontrar o item sobre o qual soltou
            const items = Array.from(document.querySelectorAll('.transaction-item'));
            const dragOverItem = items.find(item => item.classList.contains('drag-over'));
            
            if (dragOverItem) {
                const targetIndex = parseInt(dragOverItem.dataset.index);
                reorderTransactions(draggedIndex, targetIndex);
            }
            
            items.forEach(item => item.classList.remove('drag-over'));
            touchElement = null;
            draggedIndex = null;
        }
        
        async function reorderTransactions(fromIndex, toIndex) {
            const monthKey = getMonthKey(currentMonth, currentYear);
            
            // Pegar transações do mês atual
            const monthTransactions = getCurrentMonthTransactions();
            
            // Reordenar
            const [movedItem] = monthTransactions.splice(fromIndex, 1);
            monthTransactions.splice(toIndex, 0, movedItem);
            
            // Salvar ordem customizada
            movedItem.customOrder = movedItem.customOrder || {};
            monthTransactions.forEach((t, idx) => {
                t.customOrder = t.customOrder || {};
                t.customOrder[monthKey] = idx;
            });
            
            await saveTransactions();
            updateDisplay();
        }

        async function addTransaction(event) {
            event.preventDefault();
            
            const description = document.getElementById('description').value;
            const date = document.getElementById('date').value;
            
            if (editingId) {
                // Modo de edição - ajustar valor
                const transaction = transactions.find(t => t.id === editingId);
                const adjustmentType = document.getElementById('adjustmentType').value;
                const adjustmentValue = parseInputAmount(document.getElementById('adjustment').value);
                const adjustmentDesc = document.getElementById('adjustmentDesc').value.trim();
                
                if (!adjustmentType) {
                    alert('Selecione se deseja adicionar ou remover valor');
                    return;
                }
                
                if (isNaN(adjustmentValue) || adjustmentValue <= 0) {
                    alert('⚠️ Por favor, insira um valor válido maior que zero');
                    document.getElementById('adjustment').focus();
                    return;
                }
                
                if (!adjustmentDesc) {
                    alert('Por favor, adicione uma descrição para este ajuste');
                    document.getElementById('adjustmentDesc').focus();
                    return;
                }
                
                // Inicializar array de ajustes se não existir
                if (!transaction.adjustments) {
                    transaction.adjustments = [];
                }
                
                // Verificar se é recorrente
                const isRecurring = document.getElementById('recurring') ? document.getElementById('recurring').checked : false;
                
                // Verificar se está editando um ajuste existente
                if (editingAdjustmentIndex !== null) {
                    // MODO EDIÇÃO DE AJUSTE
                    const oldAdjustment = transaction.adjustments[editingAdjustmentIndex];
                    
                    // Reverter o ajuste antigo
                    if (oldAdjustment.type === 'add') {
                        transaction.amount -= oldAdjustment.amount;
                    } else {
                        transaction.amount += oldAdjustment.amount;
                    }
                    
                    // Atualizar o ajuste
                    transaction.adjustments[editingAdjustmentIndex] = {
                        type: adjustmentType,
                        amount: adjustmentValue,
                        description: adjustmentDesc,
                        date: oldAdjustment.date, // Manter data original
                        recurring: isRecurring
                    };
                    
                    // Aplicar o novo ajuste
                    if (adjustmentType === 'add') {
                        transaction.amount += adjustmentValue;
                    } else {
                        transaction.amount -= adjustmentValue;
                        if (transaction.amount < 0) transaction.amount = 0;
                    }
                    
                    editingAdjustmentIndex = null; // Limpar flag de edição
                } else {
                    // MODO NOVO AJUSTE
                    transaction.adjustments.push({
                        type: adjustmentType,
                        amount: adjustmentValue,
                        description: adjustmentDesc,
                        date: new Date().toISOString(),
                        recurring: isRecurring
                    });
                    
                    // Atualizar valor total
                    if (adjustmentType === 'add') {
                        transaction.amount += adjustmentValue;
                    } else {
                        transaction.amount -= adjustmentValue;
                        if (transaction.amount < 0) transaction.amount = 0;
                    }
                }
            } else {
                // Modo de criação
                const amount = parseInputAmount(document.getElementById('amount').value);
                
                if (isNaN(amount) || amount <= 0) {
                    alert('⚠️ Por favor, insira um valor válido maior que zero');
                    document.getElementById('amount').focus();
                    return;
                }
                
                const transaction = {
                    id: Date.now(),
                    type: currentType,
                    description,
                    amount,
                    date,
                    adjustments: [], // Inicializar com array vazio
                    paid: false // Status de pagamento
                };
                transactions.unshift(transaction);
            }
            
            await saveTransactions();
            updateDisplay();
            closeModal();
        }
        
        async function togglePaid(id) {
            const transaction = transactions.find(t => t.id === id);
            if (transaction) {
                transaction.paid = !transaction.paid;
                await saveTransactions();
                updateDisplay();
            }
        }
        
        async function deleteAdjustment(transactionId, adjustmentIndex) {
            const transaction = transactions.find(t => t.id === transactionId);
            if (!transaction || !transaction.adjustments || !transaction.adjustments[adjustmentIndex]) {
                alert('❌ Ajuste não encontrado!');
                return;
            }
            
            const adjustment = transaction.adjustments[adjustmentIndex];
            const adjDescription = adjustment.description;
            const adjAmount = formatCurrency(adjustment.amount);
            const adjType = adjustment.type === 'add' ? 'adição' : 'remoção';
            
            if (!confirm(`Deseja realmente deletar este ajuste?\n\n${adjDescription}\n${adjType === 'adição' ? '+' : '-'} ${adjAmount}\n\n⚠️ O valor será revertido automaticamente.`)) {
                return;
            }
            
            // Reverter o ajuste do valor total
            if (adjustment.type === 'add') {
                transaction.amount -= adjustment.amount;
            } else {
                transaction.amount += adjustment.amount;
            }
            
            // Remover o ajuste do array
            transaction.adjustments.splice(adjustmentIndex, 1);
            
            await saveTransactions();
            
            // Reabrir o modal para mostrar a mudança
            closeModal();
            setTimeout(() => {
                openModal(transaction.type, transactionId);
            }, 100);
        }
        
        async function deleteTransaction(id) {
            if (confirm('Deseja realmente excluir esta transação?')) {
                transactions = transactions.filter(t => t.id !== id);
                await saveTransactions();
                updateDisplay();
            }
        }
        
        async function replicatePreviousMonth() {
            // Calcular mês anterior
            let previousMonth = currentMonth - 1;
            let previousYear = currentYear;
            
            if (previousMonth < 0) {
                previousMonth = 11;
                previousYear--;
            }
            
            const previousMonthKey = getMonthKey(previousMonth, previousYear);
            const currentMonthKey = getMonthKey(currentMonth, currentYear);
            
            // Buscar transações do mês anterior JÁ ORDENADAS
            const previousMonthTransactions = transactions.filter(t => {
                const dateParts = t.date.split('-');
                const tYear = parseInt(dateParts[0]);
                const tMonth = parseInt(dateParts[1]) - 1;
                const tMonthKey = getMonthKey(tMonth, tYear);
                return tMonthKey === previousMonthKey;
            });
            
            // ORDENAR pela ordem customizada do mês anterior (CRUCIAL!)
            previousMonthTransactions.sort((a, b) => {
                const aOrder = a.customOrder && a.customOrder[previousMonthKey] !== undefined ? a.customOrder[previousMonthKey] : 999999;
                const bOrder = b.customOrder && b.customOrder[previousMonthKey] !== undefined ? b.customOrder[previousMonthKey] : 999999;
                
                if (aOrder !== bOrder) {
                    return aOrder - bOrder;
                }
                
                // Se não tem ordem customizada, ordenar por data
                return new Date(b.date) - new Date(a.date);
            });
            
            // Verificar se já existem transações no mês atual
            const currentMonthTransactions = getCurrentMonthTransactions();
            
            if (currentMonthTransactions.length > 0) {
                if (!confirm(`Este mês já tem ${currentMonthTransactions.length} transação(ões). Deseja adicionar as ${previousMonthTransactions.length} transações do mês anterior mesmo assim?`)) {
                    return;
                }
            }
            
            if (previousMonthTransactions.length === 0) {
                alert(`❌ Nenhuma transação encontrada em ${monthNames[previousMonth]} ${previousYear}`);
                return;
            }
            
            // Confirmar replicação
            const incomeCount = previousMonthTransactions.filter(t => t.type === 'income').length;
            const expenseCount = previousMonthTransactions.filter(t => t.type === 'expense').length;
            const replicateMessage = `Replicar ${previousMonthTransactions.length} transações de ${monthNames[previousMonth]} ${previousYear}?\n\n✅ ${incomeCount} provento(s)\n✅ ${expenseCount} gasto(s)`;
            
            if (!confirm(replicateMessage)) {
                return;
            }
            
            // Replicar TODAS as transações do mês anterior MANTENDO a ordem E ajustes recorrentes
            const newTransactions = previousMonthTransactions.map((t, index) => {
                // Criar nova data no primeiro dia do mês atual
                const newDate = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-01`;
                
                // Criar ordem customizada para o mês atual
                const newCustomOrder = {};
                newCustomOrder[currentMonthKey] = index; // Manter a mesma ordem do mês anterior
                
                // Filtrar apenas os ajustes marcados como recorrentes
                const recurringAdjustments = (t.adjustments || []).filter(adj => adj.recurring === true);
                
                // Calcular valor base da transação (valor original sem ajustes não-recorrentes)
                let baseAmount = t.amount;
                if (t.adjustments && t.adjustments.length > 0) {
                    // Reverter os ajustes não-recorrentes
                    t.adjustments.forEach(adj => {
                        if (!adj.recurring) {
                            if (adj.type === 'add') {
                                baseAmount -= adj.amount;
                            } else {
                                baseAmount += adj.amount;
                            }
                        }
                    });
                }
                
                return {
                    id: Date.now() + Math.random(), // ID único
                    type: t.type,
                    description: t.description,
                    amount: baseAmount, // Valor base (sem ajustes não-recorrentes)
                    date: newDate,
                    adjustments: recurringAdjustments.map(adj => ({
                        ...adj,
                        date: new Date().toISOString() // Atualizar data do ajuste
                    })), // Copiar apenas ajustes recorrentes
                    paid: false, // Resetar status de pagamento
                    customOrder: newCustomOrder // Aplicar ordem customizada do mês anterior
                };
            });
            
            // Adicionar ao início da lista
            transactions.unshift(...newTransactions);
            
            await saveTransactions();
            updateDisplay();
            
            alert(`✅ ${newTransactions.length} transações replicadas com sucesso!`);
        }
        
        function updateDisplay() {
            // Atualizar nome do mês no header
            const today = new Date();
            const isCurrentMonth = currentMonth === today.getMonth() && currentYear === today.getFullYear();
            const isFutureMonth = currentYear > today.getFullYear() || 
                                 (currentYear === today.getFullYear() && currentMonth > today.getMonth());
            const isPastMonth = currentYear < today.getFullYear() || 
                               (currentYear === today.getFullYear() && currentMonth < today.getMonth());
            
            let monthLabel = `${monthNames[currentMonth]} ${currentYear}`;
            if (isCurrentMonth) {
                monthLabel += ' (Atual)';
            } else if (isFutureMonth) {
                monthLabel += ' 📅';
            }
            document.getElementById('currentMonth').textContent = monthLabel;
            
            // Atualizar status do mês
            const monthStatus = document.getElementById('monthStatus');
            if (isFutureMonth) {
                monthStatus.textContent = '📅 Planejamento Futuro';
                monthStatus.style.background = 'rgba(100, 150, 255, 0.15)';
                monthStatus.style.color = '#6496ff';
                monthStatus.style.border = '1px solid rgba(100, 150, 255, 0.3)';
            } else if (isCurrentMonth) {
                monthStatus.textContent = '✅ Mês Atual';
                monthStatus.style.background = 'rgba(0, 255, 136, 0.15)';
                monthStatus.style.color = 'var(--accent-green)';
                monthStatus.style.border = '1px solid rgba(0, 255, 136, 0.3)';
            } else if (isPastMonth) {
                monthStatus.textContent = '📊 Histórico';
                monthStatus.style.background = 'rgba(148, 163, 184, 0.15)';
                monthStatus.style.color = 'var(--text-secondary)';
                monthStatus.style.border = '1px solid rgba(148, 163, 184, 0.3)';
            }
            
            // Filtrar transações do mês
            const monthTransactions = getCurrentMonthTransactions();
            
            // Atualizar botão de replicar mês anterior
            const replicateBtnText = document.getElementById('replicateBtnText');
            let previousMonth = currentMonth - 1;
            let previousYear = currentYear;
            if (previousMonth < 0) {
                previousMonth = 11;
                previousYear--;
            }
            
            const previousMonthKey = getMonthKey(previousMonth, previousYear);
            const previousMonthTransactions = transactions.filter(t => {
                const dateParts = t.date.split('-');
                const tYear = parseInt(dateParts[0]);
                const tMonth = parseInt(dateParts[1]) - 1;
                const tMonthKey = getMonthKey(tMonth, tYear);
                return tMonthKey === previousMonthKey;
            });
            
            // Mostrar contador com TODAS as transações do mês anterior
            if (previousMonthTransactions.length > 0) {
                replicateBtnText.innerHTML = `📋 Replicar ${monthNames[previousMonth]} <span style="background: rgba(100,150,255,0.3); padding: 2px 8px; border-radius: 6px; margin-left: 6px; font-size: 12px;">${previousMonthTransactions.length}</span>`;
            } else {
                replicateBtnText.innerHTML = `📋 Replicar Mês Anterior`;
            }
            
            const totalIncome = monthTransactions
                .filter(t => t.type === 'income')
                .reduce((sum, t) => sum + t.amount, 0);
            
            const expenseTransactions = monthTransactions.filter(t => t.type === 'expense');
            const totalExpense = expenseTransactions.reduce((sum, t) => sum + t.amount, 0);
            const paidExpenses = expenseTransactions.filter(t => t.paid).length;
            const pendingExpenses = expenseTransactions.length - paidExpenses;
            
            const balance = totalIncome - totalExpense;
            
            document.getElementById('balance').textContent = formatCurrency(balance);
            document.getElementById('balance').className = 'balance-amount ' + (balance >= 0 ? 'positive' : 'negative');
            document.getElementById('totalIncome').textContent = formatCurrency(totalIncome);
            
            // Atualizar total de gastos com indicador de status
            const expenseElement = document.getElementById('totalExpense');
            expenseElement.textContent = formatCurrency(totalExpense);
            
            // Adicionar indicador de pagamentos se houver gastos
            const expenseSummaryLabel = document.querySelector('.summary-item.expense .summary-label');
            if (expenseTransactions.length > 0) {
                expenseSummaryLabel.innerHTML = `Gastos <span style="font-size: 9px; opacity: 0.8;">(${paidExpenses}/${expenseTransactions.length} pagos)</span>`;
            } else {
                expenseSummaryLabel.textContent = 'Gastos';
            }
            
            const transactionsList = document.getElementById('transactionsList');
            
            if (monthTransactions.length === 0) {
                const isPlanning = isFutureMonth;
                transactionsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">${isPlanning ? '📅' : '📊'}</div>
                        <div class="empty-state-text">${isPlanning ? 'Nenhum planejamento para este mês.<br>Adicione seus gastos e proventos futuros!' : 'Nenhuma transação neste mês.<br>Adicione seu primeiro registro!'}</div>
                    </div>
                `;
            } else {
                transactionsList.innerHTML = monthTransactions.map((t, index) => {
                    const isPaid = t.paid || false;
                    const paidClass = isPaid ? 'paid' : '';
                    const checkIcon = isPaid ? '✓' : '';
                    const checkClass = isPaid ? 'checked' : '';
                    
                    // Mostrar checkbox apenas para gastos
                    const payCheckbox = t.type === 'expense' ? 
                        `<div class="pay-checkbox ${checkClass}" onclick="event.stopPropagation(); togglePaid(${t.id})">${checkIcon}</div>` : 
                        '<div style="width: 24px; margin-right: 12px;"></div>';
                    
                    return `
                        <div class="transaction-item ${t.type} ${paidClass}" draggable="true" data-id="${t.id}" data-index="${index}">
                            <div class="transaction-item-header">
                                <div class="drag-handle">≡</div>
                                ${payCheckbox}
                                <div class="transaction-info">
                                    <div class="transaction-description">${t.description}</div>
                                </div>
                                <div class="transaction-amount">${t.type === 'income' ? '+' : '-'} ${formatCurrency(t.amount)}</div>
                            </div>
                            <div class="transaction-item-footer">
                                <div class="transaction-date">${formatDate(t.date)}</div>
                                <div class="transaction-buttons">
                                    <button class="edit-btn" onclick="openModal('${t.type}', ${t.id})">✏️</button>
                                    <button class="delete-btn" onclick="deleteTransaction(${t.id})">🗑</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                // Adicionar event listeners para drag and drop
                setupDragAndDrop();
            }
        }
        
        function formatCurrency(value) {
            return 'R$ ' + Math.abs(value).toLocaleString('pt-BR', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }
        
        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });
        }
        
        // Exportar dados (Backup)
        function exportData() {
            const dataStr = JSON.stringify(transactions, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `backup-financeiro-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
            alert('✅ Backup salvo! Guarde este arquivo em local seguro.');
        }
        
        // Importar dados (Restaurar)
        function importData(file) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const importedTransactions = JSON.parse(e.target.result);
                    if (confirm(`Deseja restaurar ${importedTransactions.length} transações? Isso substituirá os dados atuais.`)) {
                        transactions = importedTransactions;
                        await saveTransactions();
                        updateDisplay();
                        alert('✅ Dados restaurados com sucesso!');
                    }
                } catch (error) {
                    alert('❌ Erro ao importar arquivo. Verifique se é um backup válido.');
                }
            };
            reader.readAsText(file);
        }
        
        loadTransactions();
    </script>
